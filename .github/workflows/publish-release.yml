name: Publish experimental APK
on:
  push:
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build experimental debug APK
        run: gradle assembleDebug --no-daemon
      - name: Publish experimental release v0.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2 app/build/outputs/apk/debug/app-debug.apk --title "CDR Viewer v0.2 (experimental)" --notes "Versão experimental. APK debug assinado automaticamente pelo GitHub Actions. Não garante atualização sobre versões instaladas anteriormente ou futuras. Para atualizações permanentes, configurar assinatura estável." --prerelease
