name: Publish signed Ver.cdr APK
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK availability
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"
          echo "Using preinstalled Android SDK at $ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify signing secrets and version
        env:
          KEYSTORE_B64: ${{ secrets.CDR_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.CDR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CDR_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CDR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            grep -Fq "versionName = \"$TAG\"" app/build.gradle.kts || { echo "Tag and app versionName differ"; exit 1; }
          fi
      - name: Decode private signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CDR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vercdr-release.jks"
          chmod 600 "$RUNNER_TEMP/vercdr-release.jks"
          echo "CDR_KEYSTORE_FILE=$RUNNER_TEMP/vercdr-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        env:
          CDR_KEYSTORE_PASSWORD: ${{ secrets.CDR_KEYSTORE_PASSWORD }}
          CDR_KEY_ALIAS: ${{ secrets.CDR_KEY_ALIAS }}
          CDR_KEY_PASSWORD: ${{ secrets.CDR_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon
      - name: Validate APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerCDR-signed-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --title "Ver.cdr $GITHUB_REF_NAME" --notes "APK assinado com a chave permanente. Atualização sobre versões anteriores exige mesma assinatura e versionCode crescente." --prerelease
      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/vercdr-release.jks"
